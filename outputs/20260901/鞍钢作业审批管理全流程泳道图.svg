<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2640" viewBox="0 0 1800 2640">
  <defs>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .title{font-size:42px;font-weight:700}.sub{font-size:20px;fill:#667085}.lane{font-size:21px;font-weight:650}.phase{font-size:22px;font-weight:700;writing-mode:vertical-rl;letter-spacing:5px}
      .box{fill:#eaf4ff;stroke:#2f8cff;stroke-width:2}.sys{fill:#f6f7f9;stroke:#cfd4dc;stroke-width:2}.decision{fill:#fff5eb;stroke:#e85d04;stroke-width:2.5}.alert{fill:#fff1f0;stroke:#d92d20;stroke-width:2}.finish{fill:#eaf8ef;stroke:#16a34a;stroke-width:2.5}
      .t{font-size:18px;font-weight:600}.s{font-size:15px;fill:#566176}.note{font-size:15px;fill:#475467}.edge{fill:none;stroke:#344054;stroke-width:2.2;marker-end:url(#arrow)}.back{fill:none;stroke:#d92d20;stroke-width:2.2;marker-end:url(#redArrow)}
      .grid{stroke:#dfe4ea;stroke-width:1}.phaseFill{fill:#f7faff}.header{fill:#eef5fb}.tag{font-size:14px;font-weight:650;fill:#b54708}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#344054"/></marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d92d20"/></marker>
  </defs>

  <rect width="1800" height="2640" fill="#fff"/>
  <text class="title" x="900" y="62" text-anchor="middle">鞍钢集团矿业有限公司作业审批管理全流程泳道图</text>
  <text class="sub" x="900" y="99" text-anchor="middle">依据《鞍钢集团矿业有限公司作业审批管理办法》（AK-Z-12-023-2026-01）梳理</text>

  <g transform="translate(28 125)">
    <rect class="header" x="0" y="0" width="1744" height="72"/>
    <rect class="phaseFill" x="0" y="72" width="110" height="2310"/>
    <line class="grid" x1="110" y1="0" x2="110" y2="2382"/>
    <line class="grid" x1="382" y1="0" x2="382" y2="2382"/><line class="grid" x1="654" y1="0" x2="654" y2="2382"/>
    <line class="grid" x1="926" y1="0" x2="926" y2="2382"/><line class="grid" x1="1198" y1="0" x2="1198" y2="2382"/>
    <line class="grid" x1="1470" y1="0" x2="1470" y2="2382"/><line class="grid" x1="1744" y1="0" x2="1744" y2="2382"/>
    <rect x="0" y="0" width="1744" height="2382" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="lane" x="246" y="43" text-anchor="middle">业主单位作业活动发起人</text>
    <text class="lane" x="518" y="43" text-anchor="middle">施工单位作业负责人</text>
    <text class="lane" x="790" y="34" text-anchor="middle"><tspan x="790">施工单位</tspan><tspan x="790" dy="23">安全监护人</tspan></text>
    <text class="lane" x="1062" y="34" text-anchor="middle"><tspan x="1062">专业主管部门</tspan><tspan x="1062" dy="23">/联合会签单位</tspan></text>
    <text class="lane" x="1334" y="34" text-anchor="middle"><tspan x="1334">分级审批人</tspan><tspan x="1334" dy="23">/线上审批平台</tspan></text>
    <text class="lane" x="1607" y="34" text-anchor="middle"><tspan x="1607">业主安全监管人</tspan><tspan x="1607" dy="23">/安全管理部门</tspan></text>

    <line class="grid" x1="0" y1="430" x2="1744" y2="430"/><line class="grid" x1="0" y1="905" x2="1744" y2="905"/>
    <line class="grid" x1="0" y1="1395" x2="1744" y2="1395"/><line class="grid" x1="0" y1="1900" x2="1744" y2="1900"/>
    <text class="phase" x="46" y="195">准入分流</text><text class="phase" x="46" y="565">编制审批</text>
    <text class="phase" x="46" y="1055">开工确认</text><text class="phase" x="46" y="1545">作业监管</text><text class="phase" x="46" y="2050">收尾归档</text>

    <!-- 准入分流 -->
    <rect class="box" x="166" y="100" width="160" height="58" rx="28"/><text class="t" x="246" y="136" text-anchor="middle">作业项目发起</text>
    <polygon class="decision" points="246,190 332,242 246,294 160,242"/><text class="t" x="246" y="236" text-anchor="middle"><tspan x="246">是否属于</tspan><tspan x="246" dy="21">特殊作业？</tspan></text>
    <rect class="sys" x="402" y="188" width="232" height="108" rx="8"/><text class="t" x="518" y="218" text-anchor="middle"><tspan x="518">否：执行相应规程/作业标准</tspan><tspan class="s" x="518" dy="24">常规生产操作；内部非危险且无交叉</tspan><tspan class="s" x="518" dy="21">相关方一般作业且无危险/交叉/危大</tspan></text>
    <polygon class="decision" points="790,190 876,242 790,294 704,242"/><text class="t" x="790" y="236" text-anchor="middle"><tspan x="790">是否为内部</tspan><tspan x="790" dy="21">自有人员检修？</tspan></text>
    <rect class="sys" x="946" y="188" width="232" height="108" rx="8"/><text class="t" x="1062" y="217" text-anchor="middle"><tspan x="1062">是：检修工单＋危险作业审批</tspan><tspan class="s" x="1062" dy="24">填写作业过程及收尾监管确认表</tspan><tspan class="s" x="1062" dy="21">无需填写“一件一案”审批表</tspan></text>
    <polygon class="decision" points="1334,184 1424,242 1334,300 1244,242"/><text class="t" x="1334" y="226" text-anchor="middle"><tspan x="1334">相关方独立运营/建设</tspan><tspan x="1334" dy="20">且不与本单位交叉？</tspan></text>
    <rect class="sys" x="1492" y="188" width="230" height="108" rx="8"/><text class="t" x="1607" y="216" text-anchor="middle"><tspan x="1607">是：相关方执行自有审批制度</tspan><tspan class="s" x="1607" dy="23">业主督促实施、定期监督检查</tspan><tspan class="s" x="1607" dy="21">同步执行作业项目日报告</tspan></text>
    <rect class="box" x="1218" y="330" width="232" height="86" rx="8"/><text class="t" x="1334" y="358" text-anchor="middle"><tspan x="1334">否：进入“一件一案”</tspan><tspan class="s" x="1334" dy="23">判定单项作业分级及 A/B/C</tspan><tspan class="s" x="1334" dy="20">作业前一日平台报告（抢修除外）</tspan></text>
    <path class="edge" d="M246 158V190"/><path class="edge" d="M332 242H402"/><text class="tag" x="356" y="230">否</text>
    <path class="edge" d="M246 294V336H790V294"/><text class="tag" x="270" y="325">是</text><path class="edge" d="M876 242H946"/><text class="tag" x="900" y="230">是</text>
    <path class="edge" d="M790 294V320H1200V242H1244"/><text class="tag" x="812" y="311">否</text>
    <path class="edge" d="M1424 242H1492"/><text class="tag" x="1446" y="230">是</text>
    <path class="edge" d="M1334 300V330"/><text class="tag" x="1350" y="323">否</text>

    <!-- 编制审批 -->
    <rect class="box" x="166" y="470" width="160" height="76" rx="8"/><text class="t" x="246" y="498" text-anchor="middle"><tspan x="246">编制“一件一案”</tspan><tspan class="s" x="246" dy="23">告知周边危险禁入区域</tspan></text>
    <rect class="box" x="438" y="470" width="160" height="76" rx="8"/><text class="t" x="518" y="498" text-anchor="middle"><tspan x="518">填写危险作业步骤</tspan><tspan class="s" x="518" dy="23">识别风险/制定防范措施</tspan></text>
    <rect class="box" x="438" y="600" width="160" height="86" rx="8"/><text class="t" x="518" y="629" text-anchor="middle"><tspan x="518">组织全员安全交底</tspan><tspan class="s" x="518" dy="23">内容/分工/风险/措施/应急</tspan><tspan class="s" x="518" dy="20">作业人员逐一签字</tspan></text>
    <rect class="box" x="710" y="600" width="160" height="86" rx="8"/><text class="t" x="790" y="629" text-anchor="middle"><tspan x="790">全程跟踪交底</tspan><tspan class="s" x="790" dy="23">审核人员资质及交底情况</tspan><tspan class="s" x="790" dy="20">完成后签字确认</tspan></text>
    <rect class="box" x="982" y="470" width="160" height="76" rx="8"/><text class="t" x="1062" y="498" text-anchor="middle"><tspan x="1062">按作业类型会签</tspan><tspan class="s" x="1062" dy="23">生产/地测/安全/交通/水电汽等</tspan></text>
    <rect class="box" x="1254" y="600" width="160" height="86" rx="8"/><text class="t" x="1334" y="627" text-anchor="middle"><tspan x="1334">单项审批＋综合分级审批</tspan><tspan class="s" x="1334" dy="23">A：D级及以上；B：C级及以上</tspan><tspan class="s" x="1334" dy="20">C：B级及以上</tspan></text>
    <polygon class="decision" points="1334,724 1414,770 1334,816 1254,770"/><text class="t" x="1334" y="776" text-anchor="middle">审批通过？</text>
    <rect class="alert" x="1502" y="735" width="210" height="72" rx="8"/><text class="t" x="1607" y="762" text-anchor="middle"><tspan x="1607">否：修订后重新审批</tspan><tspan class="s" x="1607" dy="23">未完成本人签字不得开工</tspan></text>
    <rect class="sys" x="1254" y="835" width="160" height="52" rx="8"/><text class="t" x="1334" y="868" text-anchor="middle">线上或纸质审批留痕</text>
    <path class="edge" d="M1334 416V440H246V470"/><path class="edge" d="M326 508H438"/><path class="edge" d="M598 508H982"/>
    <path class="edge" d="M518 546V600"/><path class="edge" d="M598 643H710"/><path class="edge" d="M870 643H1254"/><path class="edge" d="M1142 508H1210V643H1254"/>
    <path class="edge" d="M1334 686V724"/><path class="back" d="M1414 770H1502"/><text class="tag" x="1448" y="758">否</text><path class="back" d="M1607 735V565H1334V600"/>
    <path class="edge" d="M1334 816V835"/><text class="tag" x="1350" y="832">是</text>

    <!-- 开工确认 -->
    <rect class="box" x="166" y="950" width="160" height="82" rx="8"/><text class="t" x="246" y="978" text-anchor="middle"><tspan x="246">复核施工负责人、监护人</tspan><tspan class="s" x="246" dy="23">及所有作业人员资质</tspan></text>
    <rect class="box" x="710" y="950" width="160" height="82" rx="8"/><text class="t" x="790" y="978" text-anchor="middle"><tspan x="790">接收“一件一案”原件</tspan><tspan class="s" x="790" dy="23">到场履行全程监护</tspan></text>
    <rect class="box" x="1527" y="950" width="160" height="82" rx="8"/><text class="t" x="1607" y="978" text-anchor="middle"><tspan x="1607">与发起人共同到场</tspan><tspan class="s" x="1607" dy="23">核查资质/交底/现场措施并签字</tspan></text>
    <polygon class="decision" points="1334,1080 1414,1126 1334,1172 1254,1126"/><text class="t" x="1334" y="1121" text-anchor="middle"><tspan x="1334">现场条件</tspan><tspan x="1334" dy="21">确认通过？</tspan></text>
    <rect class="alert" x="1502" y="1090" width="210" height="72" rx="8"/><text class="t" x="1607" y="1117" text-anchor="middle"><tspan x="1607">否：不得开工</tspan><tspan class="s" x="1607" dy="23">整改后重新现场确认</tspan></text>
    <rect class="box" x="438" y="1230" width="160" height="72" rx="8"/><text class="t" x="518" y="1257" text-anchor="middle"><tspan x="518">组织实施作业</tspan><tspan class="s" x="518" dy="23">仅在审批区域/范围内施工</tspan></text>
    <path class="edge" d="M1334 887V920H246V950"/><path class="edge" d="M326 991H710"/><path class="edge" d="M870 991H1527"/><path class="edge" d="M1607 1032V1060H1334V1080"/>
    <path class="back" d="M1414 1126H1502"/><text class="tag" x="1448" y="1114">否</text><path class="back" d="M1607 1090V1052"/>
    <path class="edge" d="M1334 1172V1200H518V1230"/><text class="tag" x="1350" y="1192">是</text>

    <!-- 作业监管 -->
    <rect class="box" x="710" y="1438" width="160" height="78" rx="8"/><text class="t" x="790" y="1466" text-anchor="middle"><tspan x="790">全程旁站式监护</tspan><tspan class="s" x="790" dy="23">不得离岗或从事无关工作</tspan></text>
    <rect class="box" x="1527" y="1438" width="160" height="78" rx="8"/><text class="t" x="1607" y="1466" text-anchor="middle"><tspan x="1607">A级全程旁站监管</tspan><tspan class="s" x="1607" dy="23">B/C级动态巡查监督</tspan></text>
    <rect class="sys" x="982" y="1438" width="160" height="78" rx="8"/><text class="t" x="1062" y="1466" text-anchor="middle"><tspan x="1062">作业区域封闭管理</tspan><tspan class="s" x="1062" dy="23">严禁扩大范围/进入无关危险区</tspan></text>
    <polygon class="decision" points="518,1570 604,1620 518,1670 432,1620"/><text class="t" x="518" y="1614" text-anchor="middle"><tspan x="518">作业要素</tspan><tspan x="518" dy="21">是否变更？</tspan></text>
    <rect class="box" x="710" y="1580" width="160" height="82" rx="8"/><text class="t" x="790" y="1608" text-anchor="middle"><tspan x="790">仅人员变更</tspan><tspan class="s" x="790" dy="23">变更单＋资质审核＋重新交底签字</tspan></text>
    <rect class="alert" x="982" y="1580" width="190" height="82" rx="8"/><text class="t" x="1077" y="1607" text-anchor="middle"><tspan x="1077">内容/地点/范围/时间</tspan><tspan class="s" x="1077" dy="22">方式/风险发生变化</tspan><tspan class="s" x="1077" dy="20">停止并重新办理审批</tspan></text>
    <polygon class="decision" points="1334,1740 1414,1786 1334,1832 1254,1786"/><text class="t" x="1334" y="1792" text-anchor="middle">作业完成？</text>
    <path class="edge" d="M518 1302V1380H790V1438"/><path class="edge" d="M870 1477H982"/><path class="edge" d="M1142 1477H1527"/>
    <path class="edge" d="M1607 1516V1545H518V1570"/><path class="edge" d="M604 1620H710"/><text class="tag" x="635" y="1608">仅人员</text>
    <path class="back" d="M870 1620H982"/><text class="tag" x="895" y="1608">其他要素</text><path class="back" d="M1077 1580V1340H1334V887"/>
    <path class="edge" d="M518 1670V1786H1254"/><text class="tag" x="536" y="1700">无变更/变更完成</text>
    <path class="back" d="M1254 1786H1195V1477H1142"/><text class="tag" x="1162" y="1768">否</text>

    <!-- 收尾归档 -->
    <rect class="box" x="438" y="1945" width="160" height="80" rx="8"/><text class="t" x="518" y="1973" text-anchor="middle"><tspan x="518">施工负责人确认收尾</tspan><tspan class="s" x="518" dy="23">清理/隔离/设备及环境安全</tspan></text>
    <rect class="box" x="166" y="1945" width="160" height="80" rx="8"/><text class="t" x="246" y="1973" text-anchor="middle"><tspan x="246">业主发起人到场</tspan><tspan class="s" x="246" dy="23">与施工方共同专项确认</tspan></text>
    <polygon class="decision" points="1334,1970 1414,2016 1334,2062 1254,2016"/><text class="t" x="1334" y="2010" text-anchor="middle"><tspan x="1334">收尾措施</tspan><tspan x="1334" dy="21">确认通过？</tspan></text>
    <rect class="alert" x="1502" y="1980" width="210" height="72" rx="8"/><text class="t" x="1607" y="2007" text-anchor="middle"><tspan x="1607">否：继续整改</tspan><tspan class="s" x="1607" dy="23">双方重新到场确认</tspan></text>
    <rect class="box" x="166" y="2140" width="160" height="86" rx="8"/><text class="t" x="246" y="2168" text-anchor="middle"><tspan x="246">收回“一件一案”原件</tspan><tspan class="s" x="246" dy="23">完成收尾签字并归档保存</tspan></text>
    <rect class="sys" x="1254" y="2140" width="160" height="86" rx="8"/><text class="t" x="1334" y="2168" text-anchor="middle"><tspan x="1334">审批与签字记录归档</tspan><tspan class="s" x="1334" dy="23">线上平台应具备存档能力</tspan></text>
    <rect class="box" x="1527" y="2140" width="160" height="86" rx="8"/><text class="t" x="1607" y="2168" text-anchor="middle"><tspan x="1607">总结评价与优化</tspan><tspan class="s" x="1607" dy="23">建立特殊作业“一件一案”数据库</tspan></text>
    <rect class="finish" x="1254" y="2300" width="160" height="58" rx="29"/><text class="t" x="1334" y="2336" text-anchor="middle">流程结束</text>
    <path class="edge" d="M1334 1832V1905H518V1945"/><text class="tag" x="1350" y="1860">是</text><path class="edge" d="M438 1985H326"/>
    <path class="edge" d="M598 1985H1220V2016H1254"/><path class="back" d="M1414 2016H1502"/><text class="tag" x="1447" y="2004">否</text><path class="back" d="M1607 1980V1925H518V1945"/>
    <path class="edge" d="M1334 2062V2095H246V2140"/><text class="tag" x="1350" y="2084">是</text><path class="edge" d="M326 2183H1254"/><path class="edge" d="M1414 2183H1527"/><path class="edge" d="M1607 2226V2270H1334V2300"/>
  </g>

  <g transform="translate(42 2540)">
    <rect width="1716" height="70" rx="10" fill="#f8fafc" stroke="#d0d5dd"/>
    <text class="note" x="18" y="24">制度要点：“一件一案”项目审批最长30天；高处/交叉/动土/断路/吊装单项审批最长7天；临时用电最长15天；盲板抽堵/有限空间最长24小时。</text>
    <text class="note" x="18" y="50">说明：线上审批在具备条件时可替代纸质审批，但必须保留审批记录；图中未将非制度明文的视频准入规则并入主流程。</text>
  </g>
</svg>
