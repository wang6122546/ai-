name: Deploy PC prototype to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "ai文件/Ai产物文件-pc端/**"
      - ".github/workflows/deploy-pc-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare clean PC prototype
        run: |
          mkdir -p _site
          rsync -a --delete --exclude='*_副本.*' "ai文件/Ai产物文件-pc端/" _site/

      - name: Upload PC prototype
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
