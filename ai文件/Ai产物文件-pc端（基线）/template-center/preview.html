<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>作业模板预览</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <header class="preview-header">
    <div class="preview-brand"><span>安</span><div><b>作业模板预览</b><small id="templateMeta"></small></div></div>
    <div class="preview-actions"><button id="toggleDevice">移动端预览</button><button id="printPreview">打印</button><button class="primary" id="backPreview">返回设计中心</button></div>
  </header>
  <main class="preview-shell" id="previewShell">
    <section class="ticket-paper">
      <div class="ticket-title"><span class="ticket-mark">作业票</span><div><h1 id="ticketName"></h1><p>请准确填写作业信息，带 <i>*</i> 项为必填项</p></div><span class="ticket-status">模板预览</span></div>
      <div class="ticket-number"><span>作业编号：<b>系统自动生成</b></span><span>申请状态：<b>待提交</b></span></div>
      <section class="ticket-section"><h2><span>01</span> 基本信息</h2><div class="form-grid">
        <label><span><i>*</i> 作业名称</span><input placeholder="请输入作业名称" value="一号罐区动火检修"></label>
        <label><span><i>*</i> 作业申请单位</span><select><option>生产运行部</option><option>设备动力部</option><option>外委施工单位</option></select></label>
        <label><span><i>*</i> 作业等级</span><select><option>一级</option><option>特级</option><option>二级</option></select></label>
        <label><span><i>*</i> 作业负责人</span><select><option>张安全</option><option>李审批</option><option>王监护</option></select></label>
        <label><span><i>*</i> 作业地点及部位</span><input value="一号罐区 T-101 储罐东侧"></label>
        <label><span><i>*</i> 计划作业时间</span><input type="datetime-local" value="2026-08-30T08:00"></label>
        <label class="wide"><span><i>*</i> 作业内容</span><textarea>更换罐区连接管线并实施焊接作业。</textarea></label>
      </div></section>
      <section class="ticket-section"><h2><span>02</span> 风险辨识与安全措施</h2><div class="measure-list">
        <label><input type="checkbox" checked> 作业区域已隔离并设置安全警示</label>
        <label><input type="checkbox" checked> 动火分析和气体检测结果合格</label>
        <label><input type="checkbox"> 易燃物已清理，消防器材已落实</label>
        <label><input type="checkbox"> 作业人员资质和安全交底已确认</label>
      </div><textarea class="measure-note" placeholder="补充其他风险及控制措施"></textarea></section>
      <section class="ticket-section"><h2><span>03</span> 人员与附件</h2><div class="people-row"><div><small>作业负责人</small><b>张安全</b></div><div><small>现场监护人</small><b>王监护</b></div><div><small>申请人员</small><b>王安全</b></div></div><div class="upload-box"><button>＋ 上传作业方案或现场照片</button><span>支持 PDF、JPG、PNG，单个文件不超过 20MB</span></div></section>
      <footer class="ticket-footer"><button>保存草稿</button><button class="primary" id="mockSubmit">提交申请</button></footer>
    </section>
  </main>
  <div class="toast" id="previewToast"></div>
  <script src="preview.js"></script>
</body>
</html>
